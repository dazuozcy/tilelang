# attention.yaml -- manifest registry for the 'attention' family (Ascend A5).
#
# Empty registry: 910B operator entries are deliberately not ported; A5
# entries are added per-op by tilelang-op-conductor (add-ascend-op flow).
#
# Entry schema (top-level key = op_name):
#
#   <OpClassName>:
#     ref_api: "torch reference API"          # PyTorch reference implementation
#     family: <family>                       # operator family (directory name)
#     status: implemented                     # registry lifecycle status
#     torch_compile_fullgraph: true           # optional: dynamo traceability flag
#     variant_of: <OpClassName>               # optional: variant-of relation
#     signature:                              # op I/O contract
#       inputs:  {<name>: {dtype: "<dtype expr | union>"}}
#       outputs: {<name>: {dtype: "<dtype expr | same_as(input)>"}}
#       params:  {<name>: {type: <py-type>, default: <value>}}
#       shape_rules:                          # optional: shape invariant list
#         - "<rule expr>"
#     workloads:                              # benchmark/correctness shapes
#       - {<input>_shape: [...], dtypes: [...], label: "<name>"}
#     roofline:                               # analytic cost model
#       vars: {<var>: "<python expr over shapes>"}
#       flops: "<python expr>"
#       bytes: "<python expr>"
#     source:                                 # generated-code locations
#       kernel: tileops/kernels/<family>/<op>/<op>.py
#       kernel_map: {<key>: <KernelClassName>}
#       op: tileops/ops/<family>/<op>.py
#       test: tests/ops/test_<op>.py
#       bench: benchmarks/ops/bench_<op>.py
#       bench_manifest_driven: true
#
# Example entry (commented out; from the source repository's elementwise
# registry, kept here as a schema reference only -- it is NOT registered):
#
# MishFwdOp:
#   ref_api: "torch.nn.functional.mish"
#   family: elementwise
#   status: implemented
#
#   torch_compile_fullgraph: true
#   signature:
#     inputs:
#       input: {dtype: "float16 | bfloat16 | float32"}
#     outputs:
#       output: {dtype: "same_as(input)"}
#     params:
#       inplace: {type: bool, default: false}
#     shape_rules:
#       - "output.shape == input.shape"
#
#   workloads:
#     - {input_shape: [1048576], dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
#     - {input_shape: [16, 256, 80, 80], dtypes: [float16, bfloat16], label: "yolo-p3"}
#
#   roofline:
#     vars:
#       N: "product(input.shape)"
#     flops: "4 * N"
#     bytes: "2 * N * elem_bytes"
#
#   source:
#     kernel: tileops/kernels/elementwise/mish/mish.py
#     kernel_map:
#       mish: MishFwdKernel
#     op: tileops/ops/elementwise/mish.py
#     test: tests/ops/test_mish.py
#     bench: benchmarks/ops/bench_mish.py
#     bench_manifest_driven: true
